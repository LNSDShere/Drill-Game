function stripWhite(cnv){
 var w=cnv.width,h=cnv.height,x=cnv.getContext('2d'),d;
 try{d=x.getImageData(0,0,w,h)}catch(e){return null}
 var p=d.data;
 var br=0,bg=0,bb=0,n=0;
 function samp(i){br+=p[i];bg+=p[i+1];bb+=p[i+2];n++}
 for(var i0=0;i0<w;i0+=(w>>6||1)){samp(i0*4);samp(((h-1)*w+i0)*4)}
 for(var j0=0;j0<h;j0+=(h>>6||1)){samp((j0*w)*4);samp((j0*w+w-1)*4)}
 br/=n;bg/=n;bb/=n;
 function dist(i){var dr=p[i]-br,dg=p[i+1]-bg,db=p[i+2]-bb;return dr*dr+dg*dg+db*db}
 var CORE=1600, FRINGE=9000;
 var bgMask=new Uint8Array(w*h), st=[];
 for(i0=0;i0<w;i0++){st.push(i0,(h-1)*w+i0)}
 for(j0=0;j0<h;j0++){st.push(j0*w,j0*w+w-1)}
 var filled=0;
 while(st.length){
  var t=st.pop(); if(t<0||t>=w*h||bgMask[t])continue;
  var i=t*4, tx=t%w, ty=(t-tx)/w;
  var ok=dist(i)<=CORE;
  if(!ok){
   if(tx>0&&bgMask[t-1]&&Math.abs(p[i]-p[i-4])+Math.abs(p[i+1]-p[i-3])+Math.abs(p[i+2]-p[i-2])<45)ok=true;
   else if(tx<w-1&&bgMask[t+1]&&Math.abs(p[i]-p[i+4])+Math.abs(p[i+1]-p[i+5])+Math.abs(p[i+2]-p[i+6])<45)ok=true;
   else if(ty>0&&bgMask[t-w]&&Math.abs(p[i]-p[(t-w)*4])+Math.abs(p[i+1]-p[(t-w)*4+1])+Math.abs(p[i+2]-p[(t-w)*4+2])<45)ok=true;
   else if(ty<h-1&&bgMask[t+w]&&Math.abs(p[i]-p[(t+w)*4])+Math.abs(p[i+1]-p[(t+w)*4+1])+Math.abs(p[i+2]-p[(t+w)*4+2])<45)ok=true;
  }
  if(!ok)continue;

  if(!bgMask[ty2*w+tx2])continue;

   for(var dx=-2;dx<=2;dx++){var xx=tx2+dx;if(xx<0||xx>=w)continue;

 for(t2=0;t2<w*h;t2++){

  p[i2+1]=clamp(Math.round((p[i2+1]-(1-a)*bg)/a),0,255);
  p[i2+2]=clamp(Math.round((p[i2+2]-(1-a)*bb)/a),0,255);
 }
 x.putImageData(d,0,0);
 var mnX=w,mnY=h,mxX=-1,mxY=-1;
 for(var ty3=0;ty3<h;ty3++)for(var tx3=0;tx3<w;tx3++)if(p[(ty3*w+tx3)*4+3]>10){if(tx3<mnX)mnX=tx3;if(tx3>mxX)mxX=tx3;if(ty3<mnY)mnY=ty3;if(ty3>mxY)mxY=ty3}

}

    p=p.then(function(im){ if(im)return im; return probeImage(m[1].replace(/\.png$/,'.'+e)); });
   });
   return p.then(function(im){
    if(!im)return null;
    var c=cv(im.width,im.height); c.getContext('2d').drawImage(im,0,0);

function carveShafts(g){
 var R=mulberry(g.seed^0x5bf03635);
 g.shafts=[];
 var count=9+((R()*7)|0);
 for(var s=0;s<count;s++){
  var r=GROUND+28+Math.floor(R()*(ROWS-GROUND-90));
  if(r>GROUND+515&&r<GROUND+560)continue;
  var len=9+Math.floor(R()*22);
  var c=1+Math.floor(R()*Math.max(1,W-2-len));
  var sh={r:r,c:c,len:len,sups:[]};
  for(var x=c;x<c+len;x++){
   for(var y=r;y<r+2;y++){ var i=y*W+x; g.tiles[i]=0; g.ores[i]=0; g.gas[i]=0; }
  }
  for(x=c+2;x<c+len-1;x+=5){ g.tiles[(r+1)*W+x]=10; sh.sups.push(x); }
  var nc=1+Math.floor(R()*3);
  for(var q=0;q<nc;q++){
   var cx2=c+1+Math.floor(R()*(len-2));
   if(sh.sups.indexOf(cx2)>=0)continue;
   var ci=(r+1)*W+cx2;
   if(g.tiles[ci]===0)g.tiles[ci]=12;
  }
  g.shafts.push(sh);
 }
}
function genWorld(g){
 var R=mulberry(g.seed), t=g.tiles, o=g.ores;
 for(var r=GROUND;r<ROWS;r++){
  var d=r-GROUND, s=stratum(d);
  for(var c=1;c<W-1;c++){
   var i=r*W+c; t[i]=s;
   var w=OREW[s], roll=R()*100, placed=0;
   for(var q=0;q<w.length;q++){ roll-=w[q][1]; if(roll<=0){placed=w[q][0];break} }
   if(placed&&d>2)o[i]=placed;
  }
 }
 for(r=GROUND+60;r<ROWS-8;r++){
  d=r-GROUND; var ch=Math.min(.045,.004+(d-60)*8e-5);
  for(c=1;c<W-1;c++){i=r*W+c; if(!o[i]&&t[i]&&t[i]<7&&R()<ch)g.gas[i]=1}
 }
 /* rare geode shells */
 for(r=GROUND+35;r<ROWS-10;r++){
  d=r-GROUND;
  var gp=d<150?.0011:(d<380?.0016:.0021);
  for(c=2;c<W-2;c++){i=r*W+c; if(t[i]>=1&&t[i]<=6&&!o[i]&&R()<gp){t[i]=11;g.gas[i]=0}}
 }

 for(var n=0;n<50;n++){lavaBlob(g,GROUND+Math.floor(470+R()*86),1+Math.floor(R()*(W-2)),1+Math.floor(R()*3))}
 for(n=0;n<12;n++){lavaBlob(g,GROUND+Math.floor(250+R()*220),1+Math.floor(R()*(W-2)),1)}
 var vr=GROUND+540;
 for(c=23;c<=25;c++){t[vr*W+c]=8;t[(vr+1)*W+c]=8;o[vr*W+c]=0;o[(vr+1)*W+c]=0;g.gas[vr*W+c]=0;g.gas[(vr+1)*W+c]=0}
 for(c=22;c<=26;c++)t[(vr+2)*W+c]=9;
 for(r=vr;r<vr+2;r++){t[r*W+22]=9;t[r*W+26]=9}
 for(r=GROUND;r<ROWS;r++){t[r*W]=9;t[r*W+W-1]=9}

}

  var both=unb64(s.w.t), bits=unb64(s.w.g);
  for(var i=0;i<n;i++){ g.tiles[i]=both[i]&15; g.ores[i]=both[i]>>4; g.gas[i]=(bits[i>>3]>>(i&7))&1; }

 }

  if(Math.random()<.4)g.particles.push({type:'flame',x:p.x+(Math.random()-.5)*30,y:p.y+(Math.random()-.5)*30,vx:0,vy:-60,life:.4,size:6,grav:0});
  toastOnce('lava','LAVA — HULL IS COOKING, GET OUT');
 }
 /* ticking bombs */
 for(var bi=g.bombs.length-1;bi>=0;bi--){
  var b=g.bombs[bi]; b.t+=dt;
  var bc=Math.floor(b.x/T), bbr=Math.floor((b.y+14)/T);
  if(bbr<ROWS-1&&!solid(bc,bbr)){ b.vy=Math.min(b.vy+700*dt,520); b.y+=b.vy*dt; }
  else b.vy=0;
  var rem=b.fuse-b.t;
  if(rem<1.4&&b.t-b.lb>Math.max(.1,rem*.3)){ b.lb=b.t; AU.fuse(); }
  if(rem<=0){ g.bombs.splice(bi,1); explodeAt(Math.floor(b.x/T),Math.floor(b.y/T),2,.3); }
 }
 /* sonar cooldown / lifetime */
 g.sonarCd=Math.max(0,g.sonarCd-dt);
 if(g.sonar){ g.sonar.t+=dt; if(g.sonar.t>g.sonar.life)g.sonar=null; }
 /* falling rocks */
 for(var i3=g.rocks.length-1;i3>=0;i3--){
  var rk=g.rocks[i3];
  rk.vy=Math.min(rk.vy+900*dt,700);
  rk.y+=rk.vy*dt;
  if(Math.abs(rk.x-p.x)<26&&Math.abs(rk.y-p.y)<32){
   var rdmg=Math.max(10,Math.round(12+rk.vy*.03));
   applyDamage(rdmg); floatText('-'+rdmg+' HULL',p.x,p.y-30,'#e0523c');
   spawnDebris(rk.x,rk.y,'#6b5136',10);
   AU.thud(); shake=Math.max(shake,10);
   g.rocks.splice(i3,1); continue;
  }
  var rc=Math.floor(rk.x/T), rbr=Math.floor((rk.y+16)/T);
  if(rbr>=ROWS-1){ g.rocks.splice(i3,1); continue; }
  if(solid(rc,rbr)){
   var lr=rbr-1;
   if(lr<GROUND){ g.rocks.splice(i3,1); continue; }
   var li=lr*W+rc;
   if(g.tiles[li]===0){
    rk.y=lr*T+T/2;
    g.tiles[li]=rk.tile; g.ores[li]=rk.ore||0; g.gas[li]=0;
    AU.thud();
    if(Math.abs(rk.x-p.x)<120&&Math.abs(rk.y-p.y)<160)shake=Math.max(shake,4);
   } else spawnDebris(rk.x,rk.y,'#6b5136',8);
   g.rocks.splice(i3,1);
  }
 }
 /* flowing lava */
 g.lavaT+=dt;
 if(g.lavaT>0.55){ g.lavaT=0; lavaStep(); }
 g.fuel=Math.max(0,g.fuel-burn*dt);
 if(g.fuel<=0&&p.grounded&&g.state==='play'){
  g.towTimer+=dt;
  if(g.towTimer>1.6){ startTow(); return; }
 } else g.towTimer=0;
 AU.loops(thrustOn,drillOn);
 var m=Math.max(0,(Math.floor(p.y/T)-GROUND)*2);
 if(m>g.maxD){ g.maxD=m; if(m%20===0)checkContracts(); }
 while(g.msi<MILESTONES.length&&m>=MILESTONES[g.msi][0]){ toast(MILESTONES[g.msi][1]); g.msi++; }
 AU.setDrone(clamp((m-160)/650,0,1)*.06);
 if(m>30&&!g.launched){ g.launched=true; g.stats.runs++; marketTick(); }
 if(p.y<GROUND*T-30)g.launched=false;
 if(g.endless||m>700){
  g.tremorT-=dt;
  if(g.tremorT<=0){ g.tremorT=40+Math.random()*45; doTremor(); }
 }
 for(var i2=g.pickups.length-1;i2>=0;i2--){
  var pk=g.pickups[i2];
  if(!pk.rest){
   pk.vy+=700*dt; pk.x+=pk.vx*dt; pk.y+=pk.vy*dt;
   var pc2=Math.floor(pk.x/T), pr2=Math.floor((pk.y+10)/T);
   if(solid(pc2,pr2)){ pk.y=pr2*T-10; pk.vy=0; pk.vx*=.5; pk.rest=true; }
  }
  var dx=p.x-pk.x, dy=p.y-pk.y, dist=Math.hypot(dx,dy);
  if(dist<80&&cargoUnits()<CARGOV[g.upg.cargo]){ pk.x+=dx*Math.min(1,8*dt); pk.y+=dy*Math.min(1,8*dt); pk.rest=false; }
  if(dist<26&&cargoUnits()<CARGOV[g.upg.cargo]){ collect(pk.ore,pk.x,pk.y); g.pickups.splice(i2,1); }
 }
 updateParticles(dt);
 g.saveT+=dt; if(g.saveT>25){ g.saveT=0; save(); }
}
function sellOre(id,qty){

 g.cash+=total; g.stats.earned+=total;
 g.contracts.forEach(function(c){ if(c&&c.type==='deliver'&&c.ore===id)c.have=Math.min(c.target,c.have+qty); });
 checkContracts(); AU.sell(); toast('SOLD '+qty+'× '+ORE[id].n+' — '+fmt$(total));
 rebuildCargo();
}

function drawTiles(){

 for(var r=r0;r<=r1;r++)for(var c=c0;c<=c1;c++){

   if(r<ROWS-1&&g.tiles[i+W]===0)ctx.fillRect(px,py+T-8,T,8);

   if(g.gas[i]){
    ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(px+10,py+12); ctx.lineTo(px+22,py+22); ctx.lineTo(px+16,py+34);
    ctx.moveTo(px+34,py+10); ctx.lineTo(px+30,py+26); ctx.lineTo(px+40,py+36); ctx.stroke();

function drawRuler(ox,oy){
 var g=G, m=Math.max(0,(Math.floor(g.pod.y/T)-GROUND)*2);
 if(m<12)return;
 var x=vw-58, top=64, bot=vh-96;
 ctx.fillStyle='rgba(10,8,5,.55)'; ctx.fillRect(x,top,42,bot-top);
 ctx.strokeStyle='rgba(122,99,48,.6)'; ctx.strokeRect(x+.5,top+.5,42,bot-top);
 ctx.fillStyle='rgba(230,180,80,.6)'; ctx.font='500 9px "IBM Plex Mono"';
 var r0=clamp(Math.floor(cam.y/T)-1,0,ROWS-1), r1=clamp(Math.floor((cam.y+vh)/T)+1,0,ROWS-1);
 for(var r=r0;r<=r1;r++){
  var mm=(r-GROUND)*2; if(mm<0||mm%10)continue;
  var y=r*T+oy; if(y<top+6||y>bot-6)continue;
  var w=mm%50===0?24:12;
  ctx.fillRect(x+6,y,w,1);
  if(mm%50===0)ctx.fillText(mm+'m',x+8,y-4);
 }
 var py=clamp(g.pod.y+oy,top+6,bot-6);
 ctx.fillStyle='#e6b53f';
 ctx.beginPath(); ctx.moveTo(x+2,py); ctx.lineTo(x-6,py-5); ctx.lineTo(x-6,py+5); ctx.closePath(); ctx.fill();
}
function render(rdt){
 if(canvas.width!==Math.floor(vw*dpr)||canvas.height!==Math.floor(vh*dpr))resize();
 var g=G;
 var worldW=W*T, worldH=ROWS*T;

  tx=13*T+Math.sin(rtime*.06)*140-vw/2; ty=GROUND*T-vh*.62;
 } else { tx=g.pod.x-vw/2; ty=g.pod.y-vh/2; }
 tx=worldW>=vw?clamp(tx,-40,worldW-vw+40):(worldW-vw)/2;
 ty=clamp(ty,-300,Math.max(-300,worldH-vh+40));
 var k=1-Math.pow(.0001,rdt);
 cam.x+=(tx-cam.x)*(SCENE==='title'?k*.4:k); cam.y+=(ty-cam.y)*k;
 var shx=(Math.random()-.5)*shake, shy=(Math.random()-.5)*shake;
 shake=Math.max(0,shake-rdt*34);
 var ox=-cam.x+shx, oy=-cam.y+shy;
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,vw,vh);
 drawSky(ox,oy);
 ctx.save(); ctx.translate(ox,oy);
 drawTiles();
 drawSigns();
 drawBuildings(ox,oy);
 drawRocks();
 drawPickups();
 drawBombs();
 drawPod();

 for(i=0;i<cb.length;i++)cb[i].onclick=function(){
  var k=this.getAttribute('data-clr'); TEX[k]=null; delete CUSTOM[k]; clearArt(k);
  AU.click(); toast('REVERTED TO BUILT-IN — '+k.toUpperCase()); renderDepotList();
 };
}
function openDepot(){
 openModal('<div class="panel"><div class="ph"><h2>ART DEPOT</h2><button class="btn small" data-close>CLOSE — ESC</button></div><div class="pbody">'+
  '<div class="tickerline">Image files sitting NEXT TO index.html load automatically (tiles, sky, cave). Sprites on white backgrounds need the buttons below ONCE — the file picker is the only channel browsers allow for reading local pixels, and the game remembers the result forever. PNG, JPG, JPEG, WEBP all work; only the NAME matters.</div>'+
  '<button class="btn primary wide" id="selFiles">SELECT ALL IMAGE FILES — PICK EVERYTHING IN THE DIALOG</button>'+
  '<button class="btn wide" id="selDir">SELECT FOLDER — ONE CLICK, PICK YOUR GAME FOLDER</button>'+
  '<div id="drop">…OR DRAG IMAGE FILES ONTO THIS PANEL</div>'+
  '<div class="lab">ASSET SLOTS</div><div id="depList"></div>'+
  '<input type="file" accept="image/*" multiple id="inFiles" style="display:none">'+
  '<input type="file" webkitdirectory id="inDir" style="display:none">'+
  '</div></div>');
 renderDepotList();
 $('#selFiles').onclick=function(){$('#inFiles').click()};
 $('#selDir').onclick=function(){$('#inDir').click()};
 $('#inFiles').onchange=function(e){
  if(e.target.files.length)installFiles(e.target.files,false).then(renderDepotList);
  e.target.value='';
 };
 $('#inDir').onchange=function(e){
  if(e.target.files.length)installFiles(e.target.files,true).then(renderDepotList);
  e.target.value='';
 };
 var drop=$('#drop');
 drop.ondragover=function(e){ e.preventDefault(); drop.classList.add('hot'); };
 drop.ondragleave=function(){drop.classList.remove('hot')};
 drop.ondrop=function(e){
  e.preventDefault(); drop.classList.remove('hot');
  installFiles(e.dataTransfer.files,false).then(renderDepotList);
 };
}
/* ================= title ================= */
function refreshTitle(){
 var has=lsGet('ml_save');
 var btn=$('#btnContinue');
 if(has){
  try{ var s=JSON.parse(has); btn.style.display='block'; btn.innerHTML='CONTINUE — '+fmt$(s.cash)+' · '+s.maxD+'m'; }
  catch(e){ btn.style.display='none'; }
 } else btn.style.display='none';
 $('#btnNew').textContent='NEW OPERATION'; delete $('#btnNew').dataset.confirm;
}
function startGame(fresh){
 if(fresh){ G=newGame(); }
 SCENE='game'; PAUSED=false; closeModal();
 $('#stage').classList.remove('titlemode'); $('#titleScr').classList.remove('on');
 cam.x=clamp(G.pod.x-vw/2,-40,W*T-vw+40); cam.y=clamp(G.pod.y-vh/2,-300,ROWS*T-vh+40);
 G.particles.length=0; rebuildCargo(); setTicker(G.market.head); save(); refreshTitle();
}
 $('#btnNew').onclick=function(){
 var b=this; AU.click();
 if(lsGet('ml_save')&&!b.dataset.confirm){
  b.dataset.confirm='1'; b.textContent='OVERWRITE SAVE? CLICK AGAIN';
  setTimeout(function(){delete b.dataset.confirm; b.textContent='NEW OPERATION';},3000); return;
 }
 startGame(true);
};
 $('#btnContinue').onclick=function(){ AU.click(); startGame(false); };
 $('#btnHelp').onclick=function(){ AU.click(); openHelp(); };
 $('#btnDepot').onclick=function(){ AU.click(); openDepot(); };
 $('#erase').onclick=function(e){
 AU.click();
 if(e.target.dataset.c){ lsDel('ml_save'); delete e.target.dataset.c; e.target.textContent='SAVE ERASED'; refreshTitle(); }
 else { e.target.dataset.c='1'; e.target.textContent='CLICK AGAIN TO CONFIRM ERASE'; }
};
 $('#btnMute').onclick=function(){ AU.init(); AU.toggle(); setMuteIcon(); };
 $('#btnPause').onclick=function(){ if(SCENE==='game'&&!MODAL){PAUSED=true;openPause();} };
function setMuteIcon(){
 $('#btnMute').innerHTML='<i data-lucide="'+(AU.muted?'volume-x':'volume-2')+'"></i>'; icons();
}
/* ================= input ================= */
addEventListener('keydown',function(e){
 AU.init();
 var c=e.code;
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyW','KeyA','KeyS','KeyD'].indexOf(c)>=0)e.preventDefault();
 if(c==='ArrowLeft'||c==='KeyA')K.left=1;
 if(c==='ArrowRight'||c==='KeyD')K.right=1;
 if(c==='ArrowUp'||c==='KeyW'||c==='Space')K.up=1;
 if(c==='ArrowDown'||c==='KeyS')K.down=1;
 if(c==='KeyM'){ AU.toggle(); setMuteIcon(); }
 if(c==='Escape'||c==='KeyP'){
  if(MODAL)closeModal();
  else if(SCENE==='title')closeModal();
  else { if(PAUSED){PAUSED=false;closeModal();} else {PAUSED=true;openPause();} }
  return;
 }
 if(c==='KeyE'&&SCENE==='game'&&!MODAL&&!PAUSED&&window.__station){
  AU.click();
  var sk=window.__station.k;
  if(sk==='fuel')openFuel();
  else if(sk==='market')openMarket();
  else openGarage();
 }
 if(c==='KeyX'&&SCENE==='game'&&!MODAL&&!PAUSED)placeDynamite();
 if(c==='KeyQ'&&SCENE==='game'&&!MODAL&&!PAUSED)fireSonar();
 if(c==='KeyT'&&SCENE==='game'&&!MODAL&&!PAUSED)useTeleport();
 if(c==='KeyB'&&SCENE==='game'&&!MODAL&&!PAUSED)fieldBurn();
 if(c==='Enter'&&SCENE==='title'&&!MODAL){ $('#btnContinue').style.display!=='none'?$('#btnContinue').click():$('#btnNew').click(); }
});
addEventListener('keyup',function(e){
 var c=e.code;
 if(c==='ArrowLeft'||c==='KeyA')K.left=0;
 if(c==='ArrowRight'||c==='KeyD')K.right=0;
 if(c==='ArrowUp'||c==='KeyW'||c==='Space')K.up=0;
 if(c==='ArrowDown'||c==='KeyS')K.down=0;
});
document.addEventListener('click',function(e){ if(e.target&&e.target.tagName==='BUTTON')e.target.blur(); });
addEventListener('blur',function(){
 K.left=K.right=K.up=K.down=0;
 if(SCENE==='game'&&!MODAL&&!PAUSED){PAUSED=true;openPause();}
});
addEventListener('dragover',function(e){e.preventDefault()});
addEventListener('drop',function(e){e.preventDefault()});
addEventListener('pointerdown',function(){AU.init()});
addEventListener('beforeunload',function(){ if(SCENE==='game')save(); });
/* ================= main loop ================= */
var STEP=1/60, acc=0, lastT=0;
function loop(t){
 requestAnimationFrame(loop);
 var rdt=clamp((t-lastT)/1000,0,.1); lastT=t; rtime+=rdt;
 if(SCENE==='game'&&!PAUSED&&!MODAL){
  acc+=rdt; var n=0;
  while(acc>=STEP&&n++<5){ step(STEP); acc-=STEP; }
  if(G&&G.pod.y/T-GROUND>60&&Math.random()<rdt*0.10)AU.drip();
 } else if(SCENE==='title'){
  if(G&&G.particles.length<70&&Math.random()<.3)
   G.particles.push({type:'mote',x:cam.x+Math.random()*vw,y:cam.y-20,vx:(Math.random()-.5)*14,vy:22+Math.random()*26,life:8,size:2+Math.random()*3,grav:0});
  if(G)updateParticles(rdt);
 }
 if(MODAL||PAUSED)AU.loops(false,false);
 render(rdt);
 if(G)hudTick();
}
/* ================= boot ================= */
(async function boot(){
 resize(); buildFallbackArt();
 await DB.open();
 await loadArt();
 await folderLoad();
 var saveStr=lsGet('ml_save');
 G=saveStr?(deserialize(saveStr)||newGame()):newGame();
 setTicker(G.market.head);
 refreshTitle(); setMuteIcon(); icons();
 $('#titleScr').classList.add('on');
 $('#fade').style.opacity=0;
 requestAnimationFrame(function(t){ lastT=t; requestAnimationFrame(loop); });
})();
/* completeness flag — proves the whole file survived the copy */
window.__FILE_OK=true;
if(window.__ML_CHECK)clearTimeout(window.__ML_CHECK);
</script>
</body>
</html>
